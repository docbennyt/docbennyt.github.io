<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">WebD visual editing concept</title><desc id="desc">Concept interface with a selected button, a short edit request and a responsive page preview.</desc><rect width="1200" height="720" fill="#111827"/><path d="M0 620H1200M0 650H1200" stroke="#334155" stroke-width="1"/><rect x="66" y="58" width="54" height="54" rx="12" fill="#b9ed66"/><path d="M77 74l8 23 8-14 9 14 8-23" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g font-family="Arial,sans-serif"><text x="136" y="94" fill="#fff" font-size="37" font-weight="700">WebD.</text><text x="1132" y="90" text-anchor="end" fill="#b9ed66" font-size="17" letter-spacing="2">PRODUCT CONCEPT</text><text x="67" y="158" fill="#f8fafc" font-size="46" font-weight="700">Show, don't prompt.</text><rect x="65" y="196" width="1070" height="425" rx="17" fill="#1e293b" stroke="#475569"/><circle cx="89" cy="219" r="6" fill="#f87171"/><circle cx="110" cy="219" r="6" fill="#fbbf24"/><circle cx="131" cy="219" r="6" fill="#b9ed66"/><text x="600" y="224" fill="#cbd5e1" font-size="15" text-anchor="middle">Visual edit workspace</text><rect x="82" y="243" width="355" height="359" rx="10" fill="#0f172a"/><text x="105" y="276" fill="#b9ed66" font-size="15" letter-spacing="1">SELECTED ELEMENT</text><rect x="105" y="291" width="309" height="48" rx="7" fill="#334155"/><text x="119" y="321" fill="#e2e8f0" font-size="19" font-family="monospace">button.primary</text><text x="105" y="378" fill="#94a3b8" font-size="17">Requested change</text><rect x="105" y="392" width="309" height="94" rx="7" fill="#1e293b" stroke="#475569"/><text x="120" y="425" fill="#fff" font-size="22">Make this wider</text><text x="120" y="454" fill="#fff" font-size="22">on mobile.</text><rect x="105" y="533" width="309" height="46" rx="7" fill="#b9ed66"/><text x="259" y="562" fill="#142014" font-size="19" font-weight="700" text-anchor="middle">Copy edit context</text><rect x="453" y="243" width="664" height="359" rx="10" fill="#f8fafc"/><rect x="480" y="269" width="78" height="13" rx="4" fill="#334155"/><rect x="994" y="269" width="92" height="13" rx="4" fill="#cbd5e1"/><text x="785" y="352" fill="#0f172a" font-size="37" font-weight="700" text-anchor="middle">Build something</text><text x="785" y="397" fill="#0f172a" font-size="37" font-weight="700" text-anchor="middle">that matters.</text><rect x="650" y="418" width="270" height="8" rx="4" fill="#cbd5e1"/><rect x="643" y="449" width="284" height="69" rx="9" stroke="#65a30d" stroke-width="3" stroke-dasharray="7 5" fill="none"/><rect x="652" y="458" width="266" height="51" rx="7" fill="#0f172a"/><text x="785" y="490" fill="#fff" font-size="19" text-anchor="middle">Get started</text><path d="M904 500l10 43 10-19 21-9z" fill="#65a30d" stroke="#fff" stroke-width="2"/><rect x="478" y="552" width="195" height="24" rx="5" fill="#e2e8f0"/><rect x="687" y="552" width="195" height="24" rx="5" fill="#e2e8f0"/><rect x="896" y="552" width="195" height="24" rx="5" fill="#e2e8f0"/><text x="67" y="674" font-size="20" fill="#cbd5e1">LESS PROMPTING. MORE BUILDING.</text><text x="1133" y="674" font-size="18" fill="#94a3b8" text-anchor="end">aiDo / WebD</text></g></svg>