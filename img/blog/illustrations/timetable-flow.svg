<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="title desc"><title id="title">Make the timetable trustworthy.</title><desc id="desc">Preview what was understood before exporting events to a student's calendar.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1118"/><stop offset="1" stop-color="#11171b"/></linearGradient><radialGradient id="glow"><stop stop-color="#73a7ff" stop-opacity=".22"/><stop offset="1" stop-color="#73a7ff" stop-opacity="0"/></radialGradient><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#73a7ff" stop-opacity=".1"/><stop offset=".5" stop-color="#73a7ff" stop-opacity=".75"/><stop offset="1" stop-color="#73a7ff" stop-opacity=".1"/></linearGradient></defs><rect width="1200" height="720" rx="32" fill="url(#bg)"/><circle cx="1040" cy="100" r="340" fill="url(#glow)"/><circle cx="90" cy="650" r="280" fill="url(#glow)" opacity=".45"/><path d="M0 210 H1200" stroke="#27313d" stroke-width="1"/><text x="62" y="82" fill="#73a7ff" font-size="17" font-family="Inter,Arial,sans-serif" font-weight="800" letter-spacing="4">STUDENT-FIRST PRODUCT DESIGN</text><text x="62" y="142" fill="#f5f7fa" font-size="39" font-family="Inter,Arial,sans-serif" font-weight="800">Make the timetable trustworthy.</text><text x="62" y="181" fill="#aab4c1" font-size="20" font-family="Inter,Arial,sans-serif">Preview what was understood before exporting events to a student's calendar.</text><rect x="55" y="228" width="1090" height="1" fill="url(#line)"/><g><rect x="55" y="260" width="245" height="205" rx="22" fill="#151b24" stroke="#303b49" stroke-width="2"/><circle cx="86" cy="298" r="17" fill="#73a7ff" opacity=".18"/><text x="86" y="304" fill="#73a7ff" text-anchor="middle" font-size="15" font-weight="800">01</text><text x="77" y="365" fill="#f4f6f9" font-size="25" font-weight="750">Import</text><text x="77" y="403" fill="#aeb9c8" font-size="18">Read the raw</text><text x="77" y="430" fill="#aeb9c8" font-size="18">timetable</text></g><g><rect x="335" y="260" width="245" height="205" rx="22" fill="#151b24" stroke="#303b49" stroke-width="2"/><circle cx="366" cy="298" r="17" fill="#73a7ff" opacity=".18"/><text x="366" y="304" fill="#73a7ff" text-anchor="middle" font-size="15" font-weight="800">02</text><text x="357" y="365" fill="#f4f6f9" font-size="25" font-weight="750">Preview</text><text x="357" y="403" fill="#aeb9c8" font-size="18">Show parsed</text><text x="357" y="430" fill="#aeb9c8" font-size="18">sessions</text></g><g><rect x="615" y="260" width="245" height="205" rx="22" fill="#151b24" stroke="#303b49" stroke-width="2"/><circle cx="646" cy="298" r="17" fill="#73a7ff" opacity=".18"/><text x="646" y="304" fill="#73a7ff" text-anchor="middle" font-size="15" font-weight="800">03</text><text x="637" y="365" fill="#f4f6f9" font-size="25" font-weight="750">Resolve</text><text x="637" y="403" fill="#aeb9c8" font-size="18">Fix conflicts</text><text x="637" y="430" fill="#aeb9c8" font-size="18">and missing data</text></g><g><rect x="895" y="260" width="245" height="205" rx="22" fill="#151b24" stroke="#303b49" stroke-width="2"/><circle cx="926" cy="298" r="17" fill="#73a7ff" opacity=".18"/><text x="926" y="304" fill="#73a7ff" text-anchor="middle" font-size="15" font-weight="800">04</text><text x="917" y="365" fill="#f4f6f9" font-size="25" font-weight="750">Export</text><text x="917" y="403" fill="#aeb9c8" font-size="18">Keep time and</text><text x="917" y="430" fill="#aeb9c8" font-size="18">event identity</text></g><path d="M305 360 H328 l-8 -7 m8 7 l-8 7" fill="none" stroke="#73a7ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/><path d="M585 360 H608 l-8 -7 m8 7 l-8 7" fill="none" stroke="#73a7ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/><path d="M865 360 H888 l-8 -7 m8 7 l-8 7" fill="none" stroke="#73a7ff" stroke-width="3" stroke-linecap="round" stroke-