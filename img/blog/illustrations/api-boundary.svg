<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="title desc"><title id="title">Validate before you trust the data.</title><desc id="desc">A network response starts as unknown. Runtime checks turn it into a value your UI can rely on.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1118"/><stop offset="1" stop-color="#11171b"/></linearGradient><radialGradient id="glow"><stop stop-color="#39c6c0" stop-opacity=".22"/><stop offset="1" stop-color="#39c6c0" stop-opacity="0"/></radialGradient><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#39c6c0" stop-opacity=".1"/><stop offset=".5" stop-color="#39c6c0" stop-opacity=".75"/><stop offset="1" stop-color="#39c6c0" stop-opacity=".1"/></linearGradient></defs><rect width="1200" height="720" rx="32" fill="url(#bg)"/><circle cx="1040" cy="100" r="340" fill="url(#glow)"/><circle cx="90" cy="650" r="280" fill="url(#glow)" opacity=".45"/><path d="M0 210 H1200" stroke="#27313d" stroke-width="1"/><text x="62" y="82" fill="#39c6c0" font-size="17" font-family="Inter,Arial,sans-serif" font-weight="800" letter-spacing="4">TYPESCRIPT IN PRACTICE</text><text x="62" y="142" fill="#f5f7fa" font-size="39" font-family="Inter,Arial,sans-serif" font-weight="800">Validate before you trust the data.</text><text x="62" y="181" fill="#aab4c1" font-size="20" font-family="Inter,Arial,sans-serif">A network response starts as unknown. Runtime checks turn it into a value your UI can rely on.</text><rect x="55" y="228" width="1090" height="1" fill="url(#line)"/><g><rect x="55" y="260" width="245" height="205" rx="22" fill="#151b24" stroke="#303b49" stroke-width="2"/><circle cx="86" cy="298" r="17" fill="#39c6c0" opacity=".18"/><text x="86" y="304" fill="#39c6c0" text-anchor="middle" font-size="15" font-weight="800">01</text><text x="77" y="365" fill="#f4f6f9" font-size="25" font-weight="750">API payload</text><text x="77" y="403" 