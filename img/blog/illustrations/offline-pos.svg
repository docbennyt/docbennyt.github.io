<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="title desc"><title id="title">A sale must survive the network.</title><desc id="desc">Save the transaction locally, queue its sync and retry the same operation safely.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1118"/><stop offset="1" stop-color="#11171b"/></linearGradient><radialGradient id="glow"><stop stop-color="#5dc98a" stop-opacity=".22"/><stop offset="1" stop-color="#5dc98a" stop-opacity="0"/></radialGradient><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5dc98a" stop-opacity=".1"/><stop offset=".5" stop-color="#5dc98a" stop-opacity=".75"/><stop offset="1" stop-color="#5dc98a" stop-opacity=".1"/></linearGradient></defs><rect width="1200" height="720" rx="32" fill="url(#bg)"/><circle cx="1040" cy="100" r="340" fill="url(#glow)"/><circle cx="90" cy="650" r="280" fill="url(#glow)" opacity=".45"/><path d="M0 210 H1200" stroke="#27313d" stroke-width="1"/><text x="62" y="82" fill="#5dc98a" font-size="17" font-family="Inter,Arial,sans-serif" font-weight="800" letter-spacing="4">OFFLINE-FIRST SYSTEMS</text><text x="62" y="142" fill="#f5f7fa" font-size="39" font-family="Inter,Arial,sans-serif" font-weight="800">A sale must survive the network.</text><text x="62" y="181" fill="#aab4c1" font-size="20" font-family="Inter,Arial,sans-serif">Save the transaction locally, queue its sync and retry the same operation safely.</text><rect x="55" y="228" width="1090" height="1" fill="url(#line)"/><g><rect x="55" y="260" width="245" height="205" rx="22" fill="#151b24" stroke="#303b49" stroke-width="2"/><circle cx="86" cy="298" r="17" fill="#5dc98a" opacity=".18"/><text x="86" y="304" fill="#5dc98a" text-anchor="middle" font-size="15" font-weight="800">01</text><text x="77" y="365" fill="#f4f6f9" font-size="25" font-weight="750">Record</text><text x="77" y="403" fill="#aeb9c8" font-size="18">Commit sale to</text><text x="77" y="430" fill="#aeb9c8" font-size="18">local storage</text></g><g><rect x="335" y="260" width="245" height="205" rx="22" fill="#151b24" stroke="#303b49" stroke-width="2"/><circle cx="366" cy="298" r="17" fill="#5dc98a" opacity=".18"/><text x="366" y="304" fill="#5dc98a" text-anchor="middle" font-size="15" font-weight="800">02</text><text x="357" y="365" fill="#f4f6f9" font-size="25" font-weight="750">Queue</text><text x="357" y="403" fill="#aeb9c8" font-size="18">Save sync work</text><text x="357" y="430" fill="#aeb9c8" font-size="18">in that commit</text></g><g><rect x="615" y="260" width="245" height="205" rx="22" fill="#151b24" stroke="#303b49" stroke-width="2"/><circle cx="646" cy="298" r="17" fill="#5dc98a" opacity=".18"/><text x="646" y="304" fill="#5dc98a" text-anchor="middle" font-size="15" font-weight="800">03</text><text x="637" y="365" fill="#f4f6f9" font-size="25" font-weight="750">Retry</text><text x="637" y="403" fill="#aeb9c8" font-size="18">Reuse the same</text><text x="637" y="430" fill="#aeb9c8" font-size="18">operation ID</text></g><g><rect x="895" y="260" width="245" height="205" rx="22" fill="#151b24" stroke="#303b49" stroke-width="2"/><circle cx="926" cy="298" r="17" fill="#5dc98a" opacity=".18"/><text x="926" y="304" fill="#5dc98a" text-anchor="middle" font-size="15" font-weight="800">04</text><text x="917" y="365" fill="#f4f6f9" font-size="25" font-weight="750">Reconcile</text><text x="917" y="403" fill="#aeb9c8" font-size="18">Confirm one sale</text><text x="917" y="430" fill="#aeb9c8" font-size="18">and one stock move</text></g><path d="M305 360 H328 l-8 -7 m8 7 l-8 7" fill="none" stroke="#5dc98a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/><path d="M585 360 H608 l-8 -7 m8 7 l-8 7" fill="none" stroke="#5dc98a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/><path d="M865 360 H888 l-8 -7 m8 7 l-8 7" fill="none" stroke="#5dc98a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/><rect x="55" y="535" width="1090" height="112" rx="20" fill="#111820" stroke="#2c3743"/><rect x="77" y="559" width="4" height="64" rx="2" fill="#5dc98a"/><text x="101" y="579" fill="#5dc98a" font-size="15" font-family="Inter,Arial,sans-serif" font-weight="800" letter-spacing="2">THE PRACTICAL CHECK</text><text x="101" y="614" fill="#e2e7ed" font-size="21" font-family="Inter,Arial,sans-serif">A lost acknowledgement must not create a duplicate sale.</text><text x="1142" y="685" text-anchor="end" fill="#687585" font-size="13" font-family="Inter,Arial,sans-serif">DR BENNYT · FIELD NOTES</text></svg>