<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title"><title id="title">Prompt repetition versus a targeted visual edit</title><rect width="1200" height="720" fill="#111827"/><g font-family="Arial,sans-serif"><text x="60" y="80" font-size="35" fill="#f8fafc" font-weight="700">The feedback loop</text><text x="60" y="125" font-size="23" fill="#94a3b8">Illustrative workflow comparison — not measured results</text><rect x="60" y="175" width="510" height="470" rx="18" fill="#1e293b"/><rect x="630" y="175" width="510" height="470" rx="18" fill="#1e293b"/><text x="90" y="225" font-size="27" fill="#fca5a5" font-weight="700">Describe, repeat, correct</text><text x="660" y="225" font-size="27" fill="#b9ed66" font-weight="700">Select, change, verify</text><g font-size="22" fill="#f8fafc"><rect x="90" y="255" width="450" height="56" rx="8" fill="#334155"/><text x="110" y="290">Describe the button</text><rect x="90" y="337" width="450" height="56" rx="8" fill="#334155"/><text x="110" y="372">Generate a broad change</text><rect x="90" y="419" width="450" height="56" rx="8" fill="#334155"/><text x="110" y="454">Explain the mismatch</text><rect x="90" y="501" width="450" height="56" rx="8" fill="#334155"/><text x="110" y="536">Try again</text><rect x="660" y="255" width="450" height="76" rx="8" fill="#334155"/><text x="680" y="300">Select the actual element</text><rect x="660" y="368" width="450" height="76" rx="8" fill="#334155"/><text x="680" y="413">Send precise context + skill</text><rect x="660" y="481" width="450" height="76" rx="8" fill="#b9ed66"/><text x="680" y="526" fill="#111827">Review the patch and preview</text></g><path d="M315 313v20m0 62v20m0 62v20M885 333v31m0 82v31" stroke="#94a3b8" stroke-width="3"/><path d="M528 529h24V280h-12" fill="none" stroke="#fca5a5" stroke-width="3" stroke-dasharray="7 5"/><text x="90" y="611" fill="#fca5a5" font-size="19">Potential repeated context</text><text x="660" y="611" fill="#b9ed66" font-size="19">Goal: fewer unnecessary revisions</text></g></svg>