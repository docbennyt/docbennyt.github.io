name: Capture public product screenshots
on:
  push:
    branches: [portfolio-capture-20261128]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Install browser
        run: |
          npm install --no-audit --no-fund playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Capture public websites
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({args:['--no-sandbox']});
            for(const [name,url,expected] of [['guestai-home','https://guest.aido.co.zw/','guest'],['timelesshr-home','https://timelesshr.co.zw/','payroll']]){
              try{
                for(const width of [480,800,1200]){
                  const page=await browser.newPage({viewport:{width:1440,height:900},deviceScaleFactor:width/1440});
                  try{
                    const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:40000});
                    if(!response||response.status()>=400)throw Error('HTTP '+response?.status());
                    await page.waitForTimeout(2500);
                    await page.evaluate(()=>document.fonts.ready);
                    const body=await page.locator('body').innerText({timeout:10000});
                    if(body.length<100||!body.toLowerCase().includes(expected)||/checking your browser|verify you are human|access denied/i.test(body))throw Error('Unexpected page content');
                    const shot=await page.screenshot({type:'jpeg',quality:84,animations:'disabled',timeout:20000,scale:'device'});
                    const key=name+'-'+width, data=shot.toString('base64');
                    console.log('CAPTURE_BEGIN '+key);
                    for(let i=0;i<data.length;i+=4000)console.log('CAPTURE_DATA '+key+' '+data.slice(i,i+4000));
                    console.log('CAPTURE_END '+key);
                  }finally{await page.close();}
                }
                console.log('CAPTURE_OK '+name);
              }catch(e){console.log('CAPTURE_FAILED '+name+' '+e.message.slice(0,300));}
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exitCode=1;});
          JS
